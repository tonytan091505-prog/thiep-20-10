<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiệp 3D Chúc Mừng Phụ Nữ 20/10</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            perspective: 1200px;
        }

        /* Canvas hiệu ứng pháo hoa và bướm */
        #effects-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Container của Thiệp 3D */
        .card-container {
            width: 320px;
            height: 450px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s ease;
            cursor: pointer;
            z-index: 5;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            border-radius: 12px;
        }

        /* Mặt thiệp */
        .card-front, .card-inside {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            overflow: hidden;
            backface-visibility: hidden;
        }

        /* Mặt trước (Nắp thiệp có thể mở) */
        .card-front {
            background: linear-gradient(45deg, #d4145a, #fbb03b);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            transform-origin: left;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .card-front h2 {
            font-size: 26px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .card-front p {
            font-size: 14px;
            opacity: 0.9;
        }

        .card-front .heart-icon {
            font-size: 50px;
            margin-top: 15px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Mặt bên trong thiệp */
        .card-inside {
            background: #ffffff;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
            z-index: 1;
            border: 2px solid #ffd1dc;
        }

        .card-inside h3 {
            color: #d4145a;
            font-size: 20px;
            text-align: center;
            margin-bottom: 10px;
        }

        .message-area {
            width: 100%;
            height: 260px;
            border: 1px dashed #ff9a9e;
            border-radius: 8px;
            padding: 10px;
            font-size: 15px;
            line-height: 1.6;
            color: #444;
            background-color: #fff5f7;
            resize: none;
            outline: none;
            font-family: inherit;
        }

        .instruction {
            font-size: 12px;
            color: #888;
            text-align: center;
            margin-top: 5px;
        }

        /* Khi thiệp mở */
        .card-container.open .card-front {
            transform: rotateY(-160deg);
        }

        /* Bảng điều khiển phụ */
        .controls {
            position: absolute;
            bottom: 20px;
            z-index: 20;
            display: flex;
            gap: 10px;
        }

        .btn {
            background: #d4145a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: 0.3s;
        }

        .btn:hover {
            background: #b00f48;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Canvas dành cho hiệu ứng pháo hoa, hoa và bướm -->
    <canvas id="effects-canvas"></canvas>

    <!-- Khối Thiệp 3D -->
    <div class="card-container" id="card" onclick="toggleCard()">
        <!-- Mặt ngoài (Bìa thiệp) -->
        <div class="card-front">
            <h2>CHÚC MỪNG<br>20/10</h2>
            <p>Ngày Phụ Nữ Việt Nam</p>
            <div class="heart-icon">🌸</div>
            <p style="margin-top: 20px; font-size: 12px;">(Chạm để mở thiệp)</p>
        </div>

        <!-- Mặt trong thiệp -->
        <div class="card-inside" onclick="event.stopPropagation()">
            <h3>Chúc Mừng Ngày 20/10!</h3>
            <textarea class="message-area" id="customMessage">Nhân ngày Phụ nữ Việt Nam 20/10, chúc bạn/chị/em luôn xinh đẹp, rạng rỡ, hạnh phúc và gặp thật nhiều may mắn trong cuộc sống! 🌸✨💖</textarea>
            <div class="instruction">*(Bạn có thể bấm vào ô trên để chỉnh sửa lời chúc)*</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="toggleCard()">Mở / Đóng Thiệp</button>
    </div>

    <script>
        const card = document.getElementById('card');
        const canvas = document.getElementById('effects-canvas');
        const ctx = canvas.getContext('2d');

        let isOpen = false;
        let particles = [];
        let butterflies = [];

        // Thay đổi kích thước Canvas theo màn hình
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Mở/Đóng thiệp
        function toggleCard() {
            isOpen = !isOpen;
            if (isOpen) {
                card.classList.add('open');
                triggerExplosion(); // Bắn pháo hoa & hoa
                spawnButterflies(); // Thả bướm bay
            } else {
                card.classList.remove('open');
            }
        }

        // Tạo hiệu ứng Pháo hoa + Mưa hoa
        function triggerExplosion() {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const colors = ['#ff4d6d', '#ff758f', '#ffb3c1', '#ffd700', '#ffffff', '#ff85a1'];
            const flowerEmojis = ['🌸', '🌺', '🌹', '✨', '💖', '🌷'];

            // Bắn hạt pháo pháo hoa và bông hoa
            for (let i = 0; i < 80; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                particles.push({
                    x: centerX,
                    y: centerY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 20 + 10,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    emoji: flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)],
                    alpha: 1,
                    decay: Math.random() * 0.015 + 0.005,
                    gravity: 0.08
                });
            }
        }

        // Tạo hiệu ứng bướm bay
        function spawnButterflies() {
            for (let i = 0; i < 6; i++) {
                butterflies.push({
                    x: window.innerWidth / 2 + (Math.random() - 0.5) * 100,
                    y: window.innerHeight / 2 + (Math.random() - 0.5) * 100,
                    vx: (Math.random() - 0.5) * 3,
                    vy: -Math.random() * 2 - 1,
                    size: Math.random() * 10 + 20,
                    wingAngle: 0,
                    wingSpeed: Math.random() * 0.2 + 0.1,
                    alpha: 1
                });
            }
        }

        // Render hiệu ứng hoạt họa (Animation Loop)
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Cập nhật & Vẽ các hạt pháo hoa/hoa
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.globalAlpha = p.alpha;
                ctx.font = `${p.size}px serif`;
                ctx.fillText(p.emoji, p.x, p.y);
            }

            // Cập nhật & Vẽ bướm
            for (let i = butterflies.length - 1; i >= 0; i--) {
                let b = butterflies[i];
                b.x += b.vx + Math.sin(b.wingAngle) * 1.5;
                b.y += b.vy;
                b.wingAngle += b.wingSpeed;
                b.alpha -= 0.003;

                if (b.alpha <= 0 || b.y < -50) {
                    butterflies.splice(i, 1);
                    continue;
                }

                ctx.globalAlpha = b.alpha;
                ctx.font = `${b.size}px serif`;
                // Đảo cánh bướm đơn giản
                ctx.fillText('🦋', b.x, b.y);
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
